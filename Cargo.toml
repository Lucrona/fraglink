[workspace]
resolver = "2"
members = ["crates/fraglink-core", "crates/fraglink-sync", "apps/server", "apps/desktop/src-tauri"]
# `cargo test` / `cargo clippy` at the root only touch the core + sync crates by
# default, so they work without the Tauri/WebKit system libraries or Postgres.
# Server tests: `cargo test -p fraglink-server` with DATABASE_URL set (see apps/server/README.md).
default-members = ["crates/fraglink-core", "crates/fraglink-sync"]

[workspace.package]
version = "0.2.0-3"
edition = "2021"
authors = ["Lucrona"]
license-file = "LICENSE"
publish = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "unwind"
strip = true
