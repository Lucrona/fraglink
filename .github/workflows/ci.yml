name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux - fmt, clippy, tests
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fraglink
          POSTGRES_PASSWORD: fraglink
          POSTGRES_DB: fraglink
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fraglink"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Throwaway CI database (not a secret). sqlx::test creates one DB per test.
      DATABASE_URL: postgres://fraglink:fraglink@localhost:5432/fraglink
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (whole workspace incl. desktop app)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (core, sync client, server against Postgres, desktop)
        run: cargo test --workspace
      - name: Simulation smoke run
        run: cargo run --release -p fraglink-core --bin fraglink-sim -- --fast --export sim-export

  windows:
    name: Windows - tests + unsigned installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (Windows code paths)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (core + sync client incl. DPAPI, Windows)
        run: cargo test -p fraglink-core -p fraglink-sync
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      - name: Build installers (unsigned; update files signed with the updater key)
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --ci
      - name: Write latest.json (updater manifest, served from https://playfraglink.com/updates/ and http://119.42.54.86/updates/)
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $sig = Get-Content "$($exe.FullName).sig" -Raw
          $ver = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $m = [ordered]@{
            version = $ver
            notes = "Fraglink $ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $sig.Trim(); url = "https://playfraglink.com/updates/$($exe.Name)" } }
          }
          $m | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8NoBOM target/release/bundle/nsis/latest.json
          Get-Content target/release/bundle/nsis/latest.json
      - name: Upload installers
        uses: actions/upload-artifact@v5
        with:
          name: fraglink-windows-installers-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/nsis/latest.json
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v5
        with:
          name: fraglink-windows-exe-${{ github.sha }}
          path: target/release/fraglink.exe
          if-no-files-found: error
