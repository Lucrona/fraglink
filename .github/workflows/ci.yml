name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux - fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy (whole workspace incl. desktop app)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - name: Simulation smoke run
        run: cargo run --release -p fraglink-core --bin fraglink-sim -- --fast --export sim-export

  windows:
    name: Windows - tests + unsigned installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo clippy (Windows code paths)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (core, Windows)
        run: cargo test -p fraglink-core
      - name: npm ci
        working-directory: apps/desktop
        run: npm ci
      - name: Build installers (unsigned)
        working-directory: apps/desktop
        run: npx tauri build --ci
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: fraglink-windows-installers-${{ github.sha }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: fraglink-windows-exe-${{ github.sha }}
          path: target/release/fraglink.exe
          if-no-files-found: error
