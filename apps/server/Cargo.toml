[package]
name = "fraglink-server"
description = "Fraglink M2 server: accounts, desktop pairing, session sync, trust-tier hours, Steam import"
version.workspace = true
edition.workspace = true
authors.workspace = true
license-file.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
fraglink-core = { path = "../../crates/fraglink-core" }
argon2 = { version = "0.5", features = ["std"] }
axum = { version = "0.8", features = ["macros", "ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
sha1 = "0.10"
ab_glyph = "0.2"
maxminddb = "0.24"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[dev-dependencies]
tokio-tungstenite = "0.28"
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
fraglink-sync = { path = "../../crates/fraglink-sync" }
tempfile = "3"
zip = { version = "8", default-features = false, features = ["deflate"] }
