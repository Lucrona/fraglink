<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Fraglink</title>
<!-- Startup window (0.2.0-dev.10): "Checking for updates…" like Discord's updater.
     Text and progress come from Rust (updater.rs) as fraglink://splash events. -->
<style>
  @font-face { font-family: "Fraglink Russo"; src: url(fonts/RussoOne-Regular.ttf); }
  @font-face { font-family: "FL Tahoma"; src: url(fonts/tahoma.ttf); }
  html, body { margin: 0; height: 100%; overflow: hidden; user-select: none; cursor: default; }
  body {
    background: radial-gradient(ellipse 120% 80% at 50% 30%, #23262c 0%, #121317 70%, #0c0d10 100%);
    color: #8d949e; font: 11px "FL Tahoma", Tahoma, Verdana, sans-serif;
    box-sizing: border-box; border: 1px solid #2b2e35;
    display: flex; flex-direction: column; align-items: center;
  }
  .lock { margin-top: 74px; width: 220px; pointer-events: none; }
  .slogan { margin-top: 14px; color: #a9b1bc; font: 10.5px "Fraglink Russo", "Arial Black", sans-serif; letter-spacing: 4.6px; padding-left: 4.6px; }
  .status { margin-top: auto; margin-bottom: 9px; height: 13px; color: #9aa2ad; text-align: center; }
  .bar { width: 200px; height: 6px; margin-bottom: 44px; border-radius: 3px; overflow: hidden;
    background: #07080a; box-shadow: inset 0 1px 2px rgba(0,0,0,.8), 0 1px 0 rgba(255,255,255,.05); position: relative; }
  .bar b { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px;
    background: linear-gradient(#9fb6e6, #4a6fc6 60%, #3657a8); transition: width .2s ease-out; }
  .bar.busy b { width: 34%; animation: slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { left: -8%; } to { left: 74%; } }
</style>
</head>
<body data-tauri-drag-region>
  <img class="lock" src="brand/v28-lockup-chrome.svg" alt="Fraglink" draggable="false" />
  <div class="slogan" data-tauri-drag-region>PLAY. CONNECT. TRACK.</div>
  <div class="status" id="status" data-tauri-drag-region>Checking for updates…</div>
  <div class="bar busy" id="bar" data-tauri-drag-region><b id="fill"></b></div>
<script>
  (function () {
    const status = document.getElementById('status'), bar = document.getElementById('bar'), fill = document.getElementById('fill');
    function show(m) {
      if (!m) return;
      if (m.text) status.textContent = m.text;
      if (m.pct == null) { bar.classList.add('busy'); fill.style.width = ''; }
      else { bar.classList.remove('busy'); fill.style.width = Math.max(0, Math.min(100, m.pct)) + '%'; }
    }
    const T = window.__TAURI__;
    if (T && T.event) T.event.listen('fraglink://splash', e => show(e.payload));
    // Browser preview: splash.html?text=...&pct=40
    const q = new URLSearchParams(location.search);
    if (q.get('text') || q.get('pct')) show({ text: q.get('text'), pct: q.get('pct') == null ? null : +q.get('pct') });
    document.addEventListener('contextmenu', e => e.preventDefault());
  })();
</script>
</body>
</html>
