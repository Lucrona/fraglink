<!-- title: Choose a new password · Fraglink | page: reset -->
<div class="narrow wrap"><section class="panel"><h2>Choose a new password</h2><div class="body">
  <form class="f" id="reset"><div id="err" class="alert err" hidden></div>
    <label>New password<input type="password" name="password" required minlength="10" maxlength="128" autocomplete="new-password"><small>At least 10 characters. You'll be signed out everywhere.</small></label>
    <label>New password again<input type="password" name="password2" required minlength="10" maxlength="128" autocomplete="new-password"></label>
    <div class="row"><button class="btn dl">Save password</button></div></form>
</div></section></div>
