<!-- title: Games · Fraglink | page: games | desc: Every game Fraglink can detect, plus recent additions, renames and icon updates. -->
<div class="mid wrap stack games-page">
  <section class="head"><div><h1>Games</h1><div class="sub">The games Fraglink can detect. Search the list, or see what was added or renamed recently.</div></div></section>
  <div class="games-lay">
    <section class="panel g-side">
      <h2><span class="tab">Recent updates</span></h2>
      <div class="body" data-updates><p class="empty">Loading…</p></div>
    </section>
    <section class="panel g-main">
      <h2><span class="tab">Games</span><span class="more"><span class="dimt" data-count></span></span></h2>
      <div class="g-tools"><input class="in" type="search" id="games-q" placeholder="Search games" autocomplete="off" aria-label="Search games"></div>
      <div class="body">
        <div class="g-list" data-list></div>
        <p class="empty" data-none hidden></p>
        <button type="button" class="btn" data-more hidden>Show more</button>
      </div>
    </section>
  </div>
</div>
