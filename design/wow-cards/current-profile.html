<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURRENT — profile WoW cards</title>
<style>
:root{--bg:#0c0e11;--text:#c8ced6;--muted:#8a939e;--orange:#d9893b;--font:system-ui,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0c0e11;color:var(--text);font:13px/1.4 var(--font)}
.sample{background:#2a1c0e;color:#f0c58e;text-align:center;padding:7px 12px;font-size:12px}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.panel{background:#15181d;border:1px solid #24384f;border-radius:4px}
h2{margin:0;padding:8px 12px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#e89a48;background:linear-gradient(90deg,#22374d,#12171e)}
.wcs{display:flex;flex-wrap:wrap;gap:8px;padding:12px}
.wc{display:flex;gap:8px;width:260px;padding:8px;background:#181c22;border:1px solid #262c35;border-radius:4px}
.port{width:48px;height:48px;background:#22374d;border:1px solid #000;border-radius:4px;display:grid;place-items:center;font-weight:700}
b{color:#eef2f6}.sub{color:var(--muted);font-size:12px}.g{color:#a7d08c}
</style>
</head>
<body>
<div class="sample"><b>CURRENT</b> · live profile cards · SAMPLE names · not a proposal</div>
<main class="wrap">
<section class="panel"><h2>WoW characters</h2>
<div class="wcs">
  <div class="wc"><div class="port">Mo</div><div><b>Mockrend</b><div class="sub">80 Frost Mage · Samplekeep US</div><div class="g">&lt;Samplekeep&gt;</div></div></div>
  <div class="wc"><div class="port">Sa</div><div><b>Samplekin</b><div class="sub">62 Hunter · Samplekeep US</div></div></div>
  <div class="wc"><div class="port">VM</div><div><b>Vale Mocken</b><div class="sub">Warrior · EU · Forever</div></div></div>
</div>
</section>
</main>
</body></html>
