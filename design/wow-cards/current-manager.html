<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CURRENT — WoW manager</title>
<style>
:root{--font:system-ui,Segoe UI,Roboto,sans-serif}
*{box-sizing:border-box}body{margin:0;background:#0c0e11;color:#c8ced6;font:13px/1.4 var(--font)}
.sample{background:#2a1c0e;color:#f0c58e;text-align:center;padding:7px 12px}
.wrap{max-width:880px;margin:0 auto;padding:16px}
.panel{background:#15181d;border:1px solid #24384f;border-radius:4px;margin-bottom:12px}
h2{margin:0;padding:8px 12px;font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:#e89a48;background:linear-gradient(90deg,#22374d,#12171e)}
.body{padding:12px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #1a2532}
.tick{color:#8fdc79;font-weight:700}.dim{color:#8a939e;font-size:12px}
</style>
</head>
<body>
<div class="sample"><b>CURRENT</b> · Battle.net page · SAMPLE · hours and ticks mixed into one list</div>
<main class="wrap">
<section class="panel"><h2>Battle.net</h2><div class="body">Not linked · Link Battle.net · Upload /played</div></section>
<section class="panel"><h2>Verified characters</h2><div class="body">
  <div class="row"><div><b>Mockrend</b> <span class="tick">✓</span><div class="dim">Samplekeep US · Level 80 Frost Mage</div></div><div>1,284 h <span class="dim">/played</span></div></div>
  <div class="row"><div><b>Vale Mocken</b><div class="dim">EU · Forever · Level 60 Warrior</div></div><div>86 h <span class="dim">/played</span></div></div>
</div></section>
</main>
</body></html>
